[workspace.package]
version = "1.8.2"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/scalarorg/fastevm"
repository = "https://github.com/scalarorg/fastevm"
exclude = [".github/", "testing"]

[workspace]
members = [
    "execution-client"
]
resolver = "2"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rustdoc.all = "warn"
# rust.unnameable-types = "warn"

[workspace.dependencies]
# Mysticeti
rpc-shared-api = { path = "modules/rpc-shared-api", package = "rpc-shared-api" }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9" }
fastcrypto-tbls = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9" }
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9", package = "fastcrypto-zkp" }

# Alloy dependencies
# eth
alloy-chains = { version = "0.2.5", default-features = false }
alloy-dyn-abi = "1.3.1"
alloy-eip2124 = { version = "0.2.0", default-features = false }
alloy-evm = { package = "alloy-evm", git = "https://github.com/Galxe/alloy-evm", branch = "v0.21.3-gravity", default-features = false }
alloy-primitives = { version = "1.3.1", default-features = false, features = ["map-foldhash"] }
alloy-rlp = { version = "0.3.10", default-features = false, features = ["core-net"] }
alloy-sol-macro = "1.3.1"
alloy-sol-types = { version = "1.3.1", default-features = false }
alloy-trie = { version = "0.9.1", default-features = false }

alloy-hardforks = "0.3.5"

alloy-consensus = { version = "1.0.37", default-features = false }
alloy-contract = { version = "1.0.37", default-features = false }
alloy-eips = { version = "1.0.37", default-features = false }
alloy-genesis = { version = "1.0.37", default-features = false }
alloy-json-rpc = { version = "1.0.37", default-features = false }
alloy-network = { version = "1.0.37", default-features = false }
alloy-network-primitives = { version = "1.0.37", default-features = false }
alloy-provider = { version = "1.0.37", features = ["reqwest"], default-features = false }
alloy-pubsub = { version = "1.0.37", default-features = false }
alloy-rpc-client = { version = "1.0.37", default-features = false }
alloy-rpc-types = { version = "1.0.37", features = ["eth"], default-features = false }
alloy-rpc-types-admin = { version = "1.0.37", default-features = false }
alloy-rpc-types-anvil = { version = "1.0.37", default-features = false }
alloy-rpc-types-beacon = { version = "1.0.37", default-features = false }
alloy-rpc-types-debug = { version = "1.0.37", default-features = false }
alloy-rpc-types-engine = { version = "1.0.37", default-features = false }
alloy-rpc-types-eth = { version = "1.0.37", default-features = false }
alloy-rpc-types-mev = { version = "1.0.37", default-features = false }
alloy-rpc-types-trace = { version = "1.0.37", default-features = false }
alloy-rpc-types-txpool = { version = "1.0.37", default-features = false }
alloy-serde = { version = "1.0.37", default-features = false }
alloy-signer = { version = "1.0.37", default-features = false }
alloy-signer-local = { version = "1.0.37", default-features = false }
alloy-transport = { version = "1.0.37" }
alloy-transport-http = { version = "1.0.37", features = ["reqwest-rustls-tls"], default-features = false }
alloy-transport-ipc = { version = "1.0.37", default-features = false }
alloy-transport-ws = { version = "1.0.37", default-features = false }

# gravity
gravity-api-types = { package = "api-types", git = "https://github.com/Galxe/gravity-aptos", rev = "8e07902b3b1630b1d55714f354624c47fc4a9422" }
reth-pipe-exec-layer-event-bus = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-pipe-exec-layer-event-bus" }
greth = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "greth" }

# Reth (using gravity-reth)
reth-basic-payload-builder = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-basic-payload-builder" }
reth-payload-builder = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-payload-builder" }
reth-chainspec = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-chainspec" }
reth-consensus = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-consensus" }
reth-db = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-db", features = ["mdbx", "test-utils", "disable-lock"] }
reth-db-api= { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-db-api" }
reth-db-common = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-db-common" }
reth-errors = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-errors" }
reth-ethereum = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-ethereum", features = ["node", "pool", "cli"] }
reth-ethereum-consensus = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-ethereum-consensus" }
reth-ethereum-engine-primitives = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-ethereum-engine-primitives" }
reth-ethereum-primitives = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-ethereum-primitives" }
reth-ethereum-payload-builder = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-ethereum-payload-builder" }
reth-revm = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-revm", features = ["std", "witness"] }
reth-evm = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-evm" }
reth-evm-ethereum = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-evm-ethereum" }
reth-node-api = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-node-api" }
reth-node-builder = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-node-builder" }
reth-primitives-traits = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-primitives-traits" }
reth-primitives = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-primitives" }
reth-provider = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-provider", features = ["test-utils"] }
reth-rpc = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-rpc" }
reth-rpc-api = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-rpc-api" }
reth-rpc-layer = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-rpc-layer" }
reth-stateless = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-stateless" }
reth-tracing = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-tracing" }
reth-trie = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-trie" }
reth-trie-db = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-trie-db" }
reth-network-peers = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-network-peers" }
# reth-tokio-util = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-tokio-util" }
reth-transaction-pool = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-transaction-pool" }

# for patch reth-db
reth-fs-util = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-fs-util" }
reth-libmdbx = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-libmdbx" }
reth-metrics = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-metrics" }
reth-nippy-jar = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-nippy-jar" }
reth-static-file-types = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-static-file-types" }
reth-storage-errors = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-storage-errors" }
reth-prune-types = { git = "https://github.com/Galxe/gravity-reth.git", rev = "59d2d35098ecc472c0a5b95231777723b4f5738c", package = "reth-prune-types" }
# revm
revm = { package = "revm", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-bytecode = { package = "revm-bytecode", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-database = { package = "revm-database", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-state = { package = "revm-state", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-primitives = { package = "revm-primitives", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-interpreter = { package = "revm-interpreter", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-inspector = { package = "revm-inspector", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-context = { package = "revm-context", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-context-interface = { package = "revm-context-interface", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-database-interface = { package = "revm-database-interface", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
op-revm = { package = "op-revm", git = "https://github.com/Galxe/revm", branch = "v29.0.1-gravity", default-features = false }
revm-inspectors = { package = "revm-inspectors", git = "https://github.com/Galxe/revm-inspectors", branch = "v0.30.0-gravity" }

walkdir = "2.3.3"
anyhow = "1.0"
auto_impl = "1"
base64 = "0.22.1"
bincode = "2.0"
bytes = { version = "1.5.0", features = ["serde"] }

page_size = "0.6.0"
proptest = "1.7"
proptest-derive = "0.5"
rand = "0.9"
rand_08 = { package = "rand", version = "0.8" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", default-features = false }
strum_macros = "0.27"

tempfile = "3.20"
thiserror = { version = "2.0.0", default-features = false }
tokio = { version = "1.44.2", default-features = false }
eyre = "0.6"
tracing = { version = "0.1.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.0", features = ["v4"] }

# Networking and HTTP
reqwest = { version = "0.12", default-features = false }
jsonrpsee = "0.26.0"
http = "1.0"

#async 
async-stream = "0.3"
async-trait = "0.1.68"
futures = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
hyper = "1.3"
hyper-util = "0.1.5"
sysinfo = { version = "0.33", default-features = false }

# Caching
mini-moka = "0.10"

# Crypto and hashing
sha2 = { version = "0.10", default-features = false }
sha3 = "0.10.5"
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "recovery"] }
hex = "0.4"
rustc-hash = { version = "2.0", default-features = false }
schnellru = "0.2"
smallvec = "1"
triehash = "0.8"

crossbeam-channel = "0.5.13"

# Ethereum types
ethereum-types = "0.15.1"
rlp = "0.6.1"
primitive-types = "0.13.1"

# Time and duration
chrono = "0.4.41"

# metrics
metrics = "0.24.0"
metrics-derive = "0.1"
metrics-exporter-prometheus = { version = "0.16.0", default-features = false }
metrics-process = "2.1.0"
metrics-util = { default-features = false, version = "0.19.0" }

derive-getters = "0.5.0"
derive_more = { version = "2", default-features = false, features = ["full"] }

# Testing dependencies
tokio-test = "0.4"
criterion = { package = "codspeed-criterion-compat", version = "2.7" }
rayon = "1.7"

# misc-testing
arbitrary = "1.3"
assert_matches = "1.5.0"
similar-asserts = { version = "1.5.0", features = ["serde"] }

# Add execution and consensus client as dependencies for integration tests
# reth-extension = { path = "reth-extension" }
fastevm-execution = { path = "execution-client" }
fastevm-consensus = { path = "consensus-client" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1

