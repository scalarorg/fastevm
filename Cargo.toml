[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/scalarorg/fastevm"
repository = "https://github.com/scalarorg/fastevm"
exclude = [".github/", "testing"]

[workspace]
members = [
    "reth-extension",
    "execution-client",
    "consensus-client",
    "testing/integration"
]
resolver = "2"

[workspace.lints]
rust.missing_debug_implementations = "warn"
rust.missing_docs = "warn"
rust.rust_2018_idioms = { level = "deny", priority = -1 }
rust.unreachable_pub = "warn"
rust.unused_must_use = "deny"
rustdoc.all = "warn"
# rust.unnameable-types = "warn"

[workspace.dependencies]
# Mysticeti
consensus-core = { git = "https://github.com/scalarorg/mysticeti.git", package = "consensus-core" }
consensus-config = { git = "https://github.com/scalarorg/mysticeti.git", package = "consensus-config" }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9" }
fastcrypto-tbls = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9" }
fastcrypto-zkp = { git = "https://github.com/MystenLabs/fastcrypto", rev = "69d496c71fb37e3d22fe85e5bbfd4256d61422b9", package = "fastcrypto-zkp" }

# Core dependencies
alloy-consensus = { version = "1.0.37", default-features = false }
alloy-eips = { version = "1.0.37", default-features = false }
alloy-evm = { version = "0.21.0", default-features = false }
alloy-network = { version = "1.0.37", default-features = false }
alloy-rpc-types-engine = { version = "1.0.37", default-features = false }
alloy-rpc-types-eth = { version = "1.0.37", default-features = false }
alloy-signer = { version = "1.0.37", default-features = false }
alloy-signer-local = { version = "1.0.37", default-features = false }
alloy-serde = { version = "1.0.37", default-features = false }
alloy-hardforks = "0.3.5"
alloy-provider = { version = "1.0.37", features = ["reqwest"], default-features = false }
alloy-primitives = { version = "1.3.1", default-features = false, features = ["map-foldhash"] }
alloy-rlp = { version = "0.3.10", default-features = false, features = ["core-net"] }
alloy-transport = { version = "1.0.37" }
alloy-transport-http = { version = "1.0.37", features = ["reqwest-rustls-tls"], default-features = false }
alloy-transport-ipc = { version = "1.0.37", default-features = false }
alloy-transport-ws = { version = "1.0.37", default-features = false }

# Reth
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-basic-payload-builder" }
reth-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-payload-builder" }
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-chainspec" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-consensus" }
reth-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-db", features = ["mdbx", "test-utils", "disable-lock"] }
reth-db-api= { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-db-api" }
reth-db-common = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-db-common" }
reth-libmdbx = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-libmdbx" }
reth-errors = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-errors" }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-storage-errors" }
reth-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-ethereum", features = ["node", "pool", "cli"] }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-ethereum-consensus" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-ethereum-engine-primitives" }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-ethereum-primitives" }
reth-ethereum-payload-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-ethereum-payload-builder" }
reth-revm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-revm", features = ["std", "witness"] }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-evm" }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-evm-ethereum" }
reth-metrics = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-metrics" }
reth-node-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-node-api" }
reth-node-builder = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-node-builder" }
reth-node-core = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-node-core" }
reth-primitives-traits = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-primitives-traits" }
reth-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-primitives" }
reth-provider = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-provider", features = ["test-utils"] }
reth-rpc = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-rpc" }
reth-rpc-api = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-rpc-api" }
reth-rpc-layer = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-rpc-layer" }
reth-stateless = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-stateless" }
reth-tracing = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-tracing" }
reth-trie = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-trie" }
reth-trie-db = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-trie-db" }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-network-peers" }
# reth-tokio-util = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-tokio-util" }
reth-fs-util = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-fs-util" }
reth-transaction-pool = { git = "https://github.com/paradigmxyz/reth.git", tag = "v1.8.2", package = "reth-transaction-pool" }
revm = { version = "29.0.1", default-features = false }
revm-context = { version = "9.1.0", default-features = false }
revm-context-interface = { version = "10.2.0", default-features = false }

walkdir = "2.3.3"
anyhow = "1.0"
auto_impl = "1"
base64 = "0.22.1"
bincode = "2.0"
bytes = { version = "1.5.0", features = ["serde"] }

page_size = "0.6.0"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", default-features = false }
strum_macros = "0.27"

thiserror = { version = "2.0.0", default-features = false }
tokio = { version = "1.44.2", default-features = false }
eyre = "0.6"
tracing = { version = "0.1.0", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
uuid = { version = "1.0", features = ["v4"] }

# Networking and HTTP
reqwest = { version = "0.12", default-features = false }
jsonrpsee = "0.26.0"
http = "1.0"

#async 
async-stream = "0.3"
async-trait = "0.1.68"
futures = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
hyper = "1.3"
hyper-util = "0.1.5"
sysinfo = { version = "0.33", default-features = false }
# Crypto and hashing
sha2 = { version = "0.10", default-features = false }
sha3 = "0.10.5"
secp256k1 = { version = "0.30", default-features = false, features = ["global-context", "recovery"] }
hex = "0.4"
rustc-hash = { version = "2.0", default-features = false }

# Ethereum types
ethereum-types = "0.15.1"
rlp = "0.6.1"
primitive-types = "0.13.1"

# Time and duration
chrono = "0.4.41"

# metrics
metrics = "0.24.0"
metrics-derive = "0.1"
metrics-exporter-prometheus = { version = "0.16.0", default-features = false }
metrics-process = "2.1.0"
metrics-util = { default-features = false, version = "0.19.0" }

derive-getters = "0.5.0"

# Testing dependencies
tokio-test = "0.4"
criterion = { package = "codspeed-criterion-compat", version = "2.7" }
alloy-genesis = { version = "1.0.37", default-features = false }
rayon = "1.7"

# misc-testing
arbitrary = "1.3"
assert_matches = "1.5.0"


# Add execution and consensus client as dependencies for integration tests
reth-extension = { path = "reth-extension" }
fastevm-execution = { path = "execution-client" }
fastevm-consensus = { path = "consensus-client" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 1
